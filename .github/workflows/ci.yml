name: ci

# Автосборка: на пуши рабочих веток и PR. Dependabot проверяем только один раз
# на PR (без дублирующей сборки на push его ветки), main — в release.yml.

on:
  push:
    branches-ignore: [main, "dependabot/**"]
  pull_request:

jobs:
  build:
    name: build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Зависимости рендерера
        run: npm ci

      - name: Проверка качества кода
        run: npm run check

      - name: Тесты TikTok-моста
        run: npm run test:bridge

      - name: Проверка типов и сборка Vite
        run: npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Тесты журналов, миграций, диагностики и токена озвучки
        run: |
          dotnet run --project tests/LoggingTests/LoggingTests.csproj -c Release
          dotnet run --project tests/SettingsMigrationsTests/SettingsMigrationsTests.csproj -c Release
          dotnet run --project tests/DiagnosticPackageTests/DiagnosticPackageTests.csproj -c Release
          dotnet run --project tests/TtsTests/TtsTests.csproj -c Release

      - name: Иконка приложения
        run: node scripts/make-icon.mjs

      - name: Синхронизация версии в csproj
        run: node scripts/sync-version.mjs

      - name: Restore WebView2-хоста (с RID win-x64)
        run: dotnet restore webview2/YawaChat.WebView2.csproj -r win-x64

      - name: Publish хоста (проверочная сборка)
        run: >
          dotnet publish webview2/YawaChat.WebView2.csproj
          -c Release -r win-x64 --self-contained false
          -o ci-publish --no-restore

      # Та же обфускация, что в релизе (release.yml): прогоняем пайплайн
      # защиты на каждом пуше, чтобы проблема не обнаружилась уже в релизе.
      # Внутри скрипта — проверка: сборка читается, JSON-протокол цел,
      # имена реально переименованы.
      - name: Обфускация (проверка пайплайна защиты)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/obfuscate.ps1 -BinDir "ci-publish"

      # Проверочная сборка — диагностический артефакт, а не релиз.
      # Для Dependabot проверка достаточна: отдельный exe не сохраняем.
      # Нехватка квоты артефактов не должна маскировать ошибки сборки.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
        continue-on-error: true
        with:
          name: ci-build-${{ github.sha }}
          path: ci-publish/
          retention-days: 7
