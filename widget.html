<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>YawaChat — виджет OBS</title>
    <!-- Шрифты грузятся вне критического пути: media="print" не блокирует
         первую отрисовку, по готовности стили включаются (onload → all).
         Без сети запуск не ждёт таймаутов — интерфейс сразу на системном
         шрифте, веб-шрифты подменят его, когда скачаются. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=Oswald:ital,wght@0,400;0,500;0,600;0,700;1,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Press+Start+2P&family=VT323&family=Russo+One&family=Exo+2:ital,wght@0,500;0,600;0,700;1,700&family=Unbounded:wght@500;700;800&family=Caveat:wght@600;700&family=Philosopher:ital,wght@0,400;0,700;1,400&family=Oranienbaum&family=Pixelify+Sans:wght@400;500;700&family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/widget-main.tsx"></script>
  </body>
</html>
